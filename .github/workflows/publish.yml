name: Publish to npm

# Tag-driven: `git tag v2.0.5 && git push --tags`.
# workflow_dispatch is there for a re-run after a half-finished publish —
# llmtab can succeed and llmtab-desktop still fail, and the job is written so
# re-running it skips whatever already landed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing"
        type: boolean
        default: false

# Never let two publishes race; a half-published pair is worse than a delay.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # gate this in repo settings if you want manual approval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The published artefact is the one that was verified, not a later build.
      - name: Verify
        run: |
          npm run lint
          npm run typecheck
          if [ -d test ]; then
            npm test
          else
            echo "::warning::test/ is not present in the repository — skipping the suite"
          fi
          npm run build

      # A tag that disagrees with package.json publishes a version nobody
      # expects, so stop before the registry sees it.
      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          root="$(node -p "require('./package.json').version")"
          desktop="$(node -p "require('./packages/desktop/package.json').version")"
          echo "tag=$tag  llmtab=$root  llmtab-desktop=$desktop"
          if [ "$tag" != "$root" ]; then
            echo "::error::Tag v$tag does not match llmtab@$root"
            exit 1
          fi
          if [ "$tag" != "$desktop" ]; then
            echo "::error::Tag v$tag does not match llmtab-desktop@$desktop"
            exit 1
          fi

      # Provenance refuses to publish when repository.url disagrees with the
      # repo it was built from, and GitHub's rename redirects hide the drift
      # from git and gh. Catch it before the tarball is signed.
      - name: Check repository.url matches this repo
        run: |
          expected="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          for pkg in package.json packages/desktop/package.json; do
            url="$(node -p "require('./$pkg').repository.url")"
            norm="${url#git+}"; norm="${norm%.git}"
            if [ "$norm" != "$expected" ]; then
              echo "::error::$pkg repository.url is $norm, expected $expected"
              exit 1
            fi
          done
          echo "repository.url matches $expected"

      # llmtab-desktop depends on llmtab, so a desktop release that pins a
      # version the registry does not have is broken on arrival.
      - name: Check the desktop dependency range
        run: |
          root="$(node -p "require('./package.json').version")"
          range="$(node -p "require('./packages/desktop/package.json').dependencies.llmtab")"
          # llmtab-desktop is a launcher: bin.mjs resolves the shell out of the
          # llmtab package, so the CLI version is the app version. The range has
          # to admit exactly what is being published — including a prerelease,
          # which a plain caret range would exclude — or the desktop package
          # installs a different build than the one just released.
          if ! npx --yes semver --range "$range" "$root" >/dev/null 2>&1; then
            echo "::error::llmtab-desktop depends on llmtab@$range, which excludes the $root being published"
            echo "::error::a prerelease needs a prerelease-admitting range, e.g. ^${root%%-*}-0"
            exit 1
          fi

      - name: Dry run
        if: inputs.dry_run
        run: |
          npm pack --dry-run
          ( cd packages/desktop && npm pack --dry-run )

      # Publish llmtab first: llmtab-desktop resolves it at install time.
      - name: Publish llmtab
        if: '!inputs.dry_run'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          # A prerelease must not become the default install. `npm publish`
          # writes the `latest` dist-tag unless told otherwise, so a version
          # carrying a hyphen (2.1.1-beta.1) goes to `beta` instead and `latest`
          # keeps pointing at the last stable release.
          case "$version" in
            *-*) npm_tag="beta" ;;
            *)   npm_tag="latest" ;;
          esac
          echo "publishing llmtab@$version to dist-tag $npm_tag"
          if npm view "llmtab@$version" version >/dev/null 2>&1; then
            echo "llmtab@$version is already published — skipping."
          else
            npm publish --provenance --access public --tag "$npm_tag"
          fi

      - name: Publish llmtab-desktop
        if: '!inputs.dry_run'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/desktop
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) npm_tag="beta" ;;
            *)   npm_tag="latest" ;;
          esac
          echo "publishing llmtab-desktop@$version to dist-tag $npm_tag"
          if npm view "llmtab-desktop@$version" version >/dev/null 2>&1; then
            echo "llmtab-desktop@$version is already published — skipping."
          else
            npm publish --provenance --access public --tag "$npm_tag"
          fi
