name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor: the store imports node:sqlite, which does not exist
        # before it. 24 is what most people will actually run.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      # `test/` is not tracked in this repo, so a CI clone has no suite to run.
      # Skipped rather than removed so restoring the directory re-enables it
      # with no workflow change.
      - run: |
          if [ -d test ]; then
            npm test
          else
            echo "::warning::test/ is not present in the repository — skipping the suite"
          fi
      - run: npm run build
